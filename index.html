<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio Futurista</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Orbitron', sans-serif;
}

/* FONDO TIPO NEON */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #1a0033, #000);
    overflow: hidden;
    background: url("https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExaHBsendzdXBwejVjczR3cmg4Z3ExeWJwZWtocmprcWFucWw3Z2dwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lTWmuCMJ90Ems/giphy.gif") no-repeat center center fixed;
    background-size: cover;
}

/* CONTENEDOR PRINCIPAL */
.container {
    position: relative;
    padding: 40px;
    width: 850px;
    border-radius: 20px;
    background: rgba(0,0,0,0.85);
    
    /* BORDE NEON */
    border: 2px solid white;
    box-shadow: 
        0 0 10px white,
        0 0 20px #a855f7,
        0 0 40px #7e22ce;

    text-align: center;
}

/* LINEAS DECORATIVAS */
.container::before,
.container::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid white;
}

.container::before {
    top: -10px;
    left: -10px;
    border-right: none;
    border-bottom: none;
}

.container::after {
    bottom: -10px;
    right: -10px;
    border-left: none;
    border-top: none;
}

/* HEADER */
.header {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 40px;
}

h1 {
    color: white;
    letter-spacing: 4px;
    text-shadow: 0 0 10px #a855f7;
    font-size: 32px;
}

/* BOTON LINK */
.link-btn {
    width: 40px;
    height: 40px;
    border: 2px solid white;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.link-btn:hover {
    background: #a855f7;
    box-shadow: 0 0 15px #a855f7;
}

.link-btn::before {
    content: "🔗";
}

/* BOTONES */
.buttons {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
}

/* ITEM */
.item {
    text-align: center;
    flex: 1;
    min-width: 160px;
}

.title {
    color: white;
    margin-bottom: 15px;
    letter-spacing: 2px;
    font-weight: bold;
    font-size: 13px;
    text-transform: uppercase;
}

/* BOTON IMAGEN */
.btn {
    width: 160px;
    height: 160px;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #a855f7;
    display: inline-block;
    
    box-shadow:
        0 0 10px #a855f7,
        inset 0 0 15px #a855f7;

    transition: 0.3s;
    cursor: pointer;
}

.btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
}

.btn:hover {
    transform: scale(1.1);
    box-shadow:
        0 0 20px #c084fc,
        0 0 40px #a855f7;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>PORTAFOLIO KEVIN :P</h1>
        <a href="https://jarudev.github.io/itcts4z/" class="link-btn"></a>
    </div>

    <div class="buttons">

        <div class="item">
            <div class="title">Electronica Básica</div>
            <a href="electronicabasica.html" class="btn">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=200&auto=format&fit=crop" alt="Electrónica Básica">
            </a>
        </div>

        <div class="item">
            <div class="title">Electronica</div>
            <a href="electronica.html" class="btn">
                <img src="https://d3puay5pkxu9s4.cloudfront.net/curso/4155/800_imagen.jpg" alt="Ley de Ohm y Watt">
            </a>
        </div>

        <div class="item">
            <div class="title">Taller Fundamentos</div>
            <a href="tallerElectronica.html" class="btn">
                <img src="https://content.nationalgeographic.com.es/medio/2023/10/03/representacion-artistica-de-electrones_d4565c4f_1146655812_231003120447_1280x1280.jpg" alt="Taller Electrónica">
            </a>
        </div>

    </div>

</div>

</body>
</html>
